version: "3.9"

# ============================================================
# CrimeLink Docker Compose
# Run with: docker compose up --build
# ============================================================

services:

  # ── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: crimelink_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crimelink_db
      POSTGRES_USER: crimelink_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crimelink_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crimelink_user -d crimelink_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crimelink_net

  # ── Backend API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crimelink_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://crimelink_user:${POSTGRES_PASSWORD:-crimelink_dev_password}@postgres:5432/crimelink_db
      DATABASE_URL_SYNC: postgresql://crimelink_user:${POSTGRES_PASSWORD:-crimelink_dev_password}@postgres:5432/crimelink_db
      UPLOAD_DIRECTORY: /app/evidence_storage
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:80,http://frontend
    ports:
      - "8000:8000"
    volumes:
      - evidence_storage:/app/evidence_storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crimelink_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: crimelink_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - crimelink_net

volumes:
  postgres_data:
    driver: local
  evidence_storage:
    driver: local

networks:
  crimelink_net:
    driver: bridge
